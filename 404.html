<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<script>!function(){var t=localStorage.getItem("portfolio-theme");if(t)document.documentElement.dataset.theme=t;}();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found · Andrés Moreno</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f9fb;--surface:#fff;--border:#e4e7ec;--text:#111827;--text-muted:#6b7280;--accent:#3b82f6;--mono:'DM Mono',monospace}
[data-theme="dark"]{--bg:#0a0e1a;--surface:#111827;--border:#1f2937;--text:#f1f5f9;--text-muted:#94a3b8;--accent:#60a5fa}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 16px;line-height:1.6}
.box{max-width:520px;text-align:center}
.code{font-family:var(--mono);color:var(--accent);font-size:14px;letter-spacing:.08em}
h1{font-size:2rem;margin:.4rem 0 .6rem}
p{color:var(--text-muted)}
.links{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin-top:1.6rem}
a.btn{font-size:14px;text-decoration:none;color:var(--text);border:1px solid var(--border);background:var(--surface);padding:.6rem 1.1rem;border-radius:8px}
a.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>This page doesn't exist or has moved. All my projects are on the home page.</p>
  <div class="links">
    <a class="btn main" href="/">Home page</a>
    <a class="btn" href="/#projects">Projects</a>
    <a class="btn" href="/resume.pdf">Resume</a>
  </div>
</div>
</body>
</html>
